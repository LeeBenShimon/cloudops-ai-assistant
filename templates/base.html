<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}CloudOps AI Assistant{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% block extra_css %}{% endblock %}
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body data-session-id="{{ session_id|default('') }}" data-session-title="{{ session_title|default('New conversation') }}">
  <div class="page-frame">
    <header class="navbar">
      <a class="navbar-logo" href="{{ url_for('home') }}">
        <span class="logo-icon">☁️</span>
        <span class="navbar-copy">
          <strong>CloudOps AI Assistant</strong>
        </span>
      </a>
      <div class="navbar-right">
        <span class="navbar-badge">Live retrieval</span>
        <nav class="navbar-nav">
          <a href="{{ url_for('home') }}">Chat</a>
          <a href="{{ url_for('about') }}">About</a>
        </nav>
      </div>
    </header>

    <main class="app-shell">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
